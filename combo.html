<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Locker pattern</title>
<style>
  :root{
    --steel:#2f4250; --steel-2:#3a5262; --teal:#3e6b73; --brass:#c29a3b; --brass-ink:#3a2c08;
    --bg:#e9edee; --panel:#f7f9f9; --ink:#16212a; --muted:#5b6b75; --line:#c9d2d6; --warn:#a8442f;
  }
  @media (prefers-color-scheme: dark){
    :root{ color-scheme:dark; --bg:#141c22; --panel:#1c2830; --ink:#e6ecee; --muted:#93a3ad; --line:#33444f;
           --steel:#22323d; --steel-2:#2c404d; --teal:#6fa9b3; --warn:#e08a74; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif;}
  main{max-width:420px;margin:0 auto;padding:20px 16px 48px}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  h1{font-size:1.15rem;margin:0;font-weight:600;letter-spacing:.01em}
  button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);
         border-radius:8px;padding:8px 12px;cursor:pointer}
  button:hover{border-color:var(--teal)}
  button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  button.primary{background:var(--teal);border-color:var(--teal);color:#fff}
  @media (prefers-color-scheme: dark){ button.primary{color:#0e161b} }
  button[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
  button:disabled{opacity:.45;cursor:not-allowed}

  /* the pattern pad is the locker door */
  .pad{background:linear-gradient(180deg,var(--steel-2),var(--steel));border-radius:14px;padding:10px;
       box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
  svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair}
  .dot{fill:#9fb3bd}
  .dot.on{fill:var(--brass)}
  .ring{fill:none;stroke:var(--brass);stroke-width:1.2;opacity:0}
  .ring.on{opacity:.9}
  #trail{fill:none;stroke:var(--brass);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
  .hint{color:var(--muted);font-size:.9rem;margin:10px 2px 16px;min-height:1.4em}
  .hint.warn{color:var(--warn)}

  .rows{display:grid;gap:8px}
  .row{display:grid;grid-template-columns:3.6rem repeat(3,1fr);gap:8px;align-items:center}
  .row span{color:var(--muted);font-size:.9rem}
  /* numbers shown as brass locker tags */
  .tag,.row input{height:46px;border-radius:23px;text-align:center;font-size:1.25rem;font-weight:600;
       font-variant-numeric:tabular-nums}
  .tag{display:grid;place-items:center;background:var(--brass);color:var(--brass-ink);
       box-shadow:inset 0 0 0 2px rgba(255,255,255,.25), inset 0 -3px 0 rgba(0,0,0,.15)}
  .tag.empty{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
  .row input{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-family:inherit}
  .row input.bad{border-color:var(--warn)}
  .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .export{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
  .export p{color:var(--muted);font-size:.9rem;margin:0 0 10px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <header>
    <h1>Locker pattern</h1>
    <button id="modeBtn" aria-pressed="false">Edit mode</button>
  </header>

  <div class="pad"><svg id="pad" viewBox="0 0 100 100" aria-label="5 by 5 pattern pad"></svg></div>
  <p class="hint" id="hint">Swipe a pattern to see its locker numbers.</p>

  <div class="rows" id="rows"></div>

  <div id="editTools" hidden>
    <div class="actions">
      <button class="primary" id="saveBtn" disabled>Save to data set</button>
      <button id="removeBtn" disabled>Remove this pattern</button>
    </div>
    <div class="export">
      <p id="count"></p>
      <div class="actions">
        <button id="dlBtn">Download JSON</button>
        <button id="copyBtn">Copy JSON</button>
      </div>
    </div>
  </div>
</main>

/* ---------- pattern pad ---------- */
const NS = 'http://www.w3.org/2000/svg';
const pos = i => ({ x: 10 + (i % N) * 20, y: 10 + Math.floor(i / N) * 20 });
const trail = document.createElementNS(NS, 'polyline'); trail.id = 'trail'; svg.appendChild(trail);
const dots = [], rings = [];
for (let i = 0; i < N * N; i++) {
  const { x, y } = pos(i);
  const r = document.createElementNS(NS, 'circle');
  r.setAttribute('cx', x); r.setAttribute('cy', y); r.setAttribute('r', 5.5); r.classList.add('ring');
  const d = document.createElementNS(NS, 'circle');
  d.setAttribute('cx', x); d.setAttribute('cy', y); d.setAttribute('r', 2); d.classList.add('dot');
  svg.append(r, d); rings.push(r); dots.push(d);
}
function toPad(e) {
  const b = svg.getBoundingClientRect();
  return { x: (e.clientX - b.left) / b.width * 100, y: (e.clientY - b.top) / b.height * 100 };
}
function dotAt(p) {
  const c = Math.round((p.x - 10) / 20), r = Math.round((p.y - 10) / 20);
  if (c < 0 || c >= N || r < 0 || r >= N) return -1;
  const i = r * N + c, q = pos(i);
  return Math.hypot(p.x - q.x, p.y - q.y) <= 7 ? i : -1;
}
function gcd(a, b) { return b ? gcd(b, a % b) : Math.abs(a); }
function addDot(i) {
  if (i < 0 || path.includes(i)) return;
  if (path.length) {            // like Android: dots passed over in a straight line are included
    const a = path[path.length - 1];
    const dr = Math.floor(i / N) - Math.floor(a / N), dc = i % N - a % N, g = gcd(dr, dc);
    for (let k = 1; k < g; k++) {
      const m = (Math.floor(a / N) + dr / g * k) * N + (a % N + dc / g * k);
      if (!path.includes(m)) path.push(m);
    }
  }
  path.push(i);
}
function drawPad() {
  dots.forEach((d, i) => { const on = path.includes(i); d.classList.toggle('on', on); rings[i].classList.toggle('on', on); });
  const pts = path.map(i => { const p = pos(i); return p.x + ',' + p.y; });
  if (drawing && pointer && path.length) pts.push(pointer.x + ',' + pointer.y);
  trail.setAttribute('points', pts.join(' '));
}
svg.addEventListener('pointerdown', e => {
  e.preventDefault(); svg.setPointerCapture(e.pointerId);
  drawing = true; path = []; pointer = toPad(e); addDot(dotAt(pointer)); drawPad();
});
svg.addEventListener('pointermove', e => {
  if (!drawing) return; pointer = toPad(e); addDot(dotAt(pointer)); drawPad();
});
function endSwipe() {
  if (!drawing) return; drawing = false; pointer = null; drawPad(); onPattern();
}
svg.addEventListener('pointerup', endSwipe);
svg.addEventListener('pointercancel', endSwipe);

/* ---------- data ---------- */
const key = p => p.join('-');
const findIndex = p => DATA.findIndex(e => key(e.pattern) === key(p));
// Patterns that aren't in the data set still get fixed numbers, derived from the pattern itself,
// so every swipe shows something and the same swipe always shows the same thing.
function derivedRows(p) {
  let h = 2166136261;
  for (const ch of key(p)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  const next = () => { h += 0x6D2B79F5; let t = h;
    t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  return Array.from({ length: 5 }, () => Array.from({ length: 3 }, () => Math.floor(next() * (MAX_NUM + 1))));
}
function exportJSON() {
  return '[\n' + DATA.map(e => JSON.stringify({ pattern: e.pattern, rows: e.rows })).join(',\n') + '\n]';
}

/* ---------- rows ---------- */
function renderRows(values) {
  rowsEl.innerHTML = '';
  for (let r = 0; r < 5; r++) {
    const row = document.createElement('div'); row.className = 'row';
    const label = document.createElement('span'); label.textContent = 'Row ' + (r + 1); row.appendChild(label);
    for (let c = 0; c < 3; c++) {
      const v = values ? values[r][c] : null;
      if (editing) {
        const inp = document.createElement('input');
        inp.type = 'number'; inp.min = 0; inp.max = MAX_NUM; inp.step = 1; inp.inputMode = 'numeric';
        inp.setAttribute('aria-label', `Row ${r + 1}, number ${c + 1}`);
        if (v !== null) inp.value = v;
        inp.addEventListener('input', () => inp.classList.remove('bad'));
        row.appendChild(inp);
      } else {
        const t = document.createElement('div');
        t.className = 'tag' + (v === null ? ' empty' : ''); t.textContent = v === null ? '–' : v;
        row.appendChild(t);
      }
    }
    rowsEl.appendChild(row);
  }
}
function readInputs() {
  const inputs = [...rowsEl.querySelectorAll('input')]; let ok = true;
  const vals = inputs.map(inp => {
    const n = Number(inp.value);
    const good = inp.value.trim() !== '' && Number.isInteger(n) && n >= 0 && n <= MAX_NUM;
    inp.classList.toggle('bad', !good); if (!good) ok = false; return n;
  });
  return ok ? [0, 1, 2, 3, 4].map(r => vals.slice(r * 3, r * 3 + 3)) : null;
}
function say(msg, warn) { hint.textContent = msg; hint.classList.toggle('warn', !!warn); }
function updateCount() { $('count').textContent = `Data set holds ${DATA.length} patterns. Changes stay in this tab until you paste the JSON into the HTML file.`; }

/* ---------- flow ---------- */
function onPattern() {
  if (path.length < MIN_DOTS) {
    path = []; drawPad(); say(`Connect at least ${MIN_DOTS} dots.`, true);
    $('saveBtn').disabled = true; $('removeBtn').disabled = true; return;
  }
  const i = findIndex(path);
  if (editing) {
    renderRows(i >= 0 ? DATA[i].rows : null);
    $('saveBtn').disabled = false; $('removeBtn').disabled = i < 0;
    say(i >= 0 ? 'This pattern is already in the data set. Edit its numbers and save.'
               : 'New pattern. Enter 15 numbers from 0 to 30, then save.');
  } else {
    renderRows(i >= 0 ? DATA[i].rows : derivedRows(path));
    say('Swipe again to look up another pattern.');
  }
}
$('saveBtn').addEventListener('click', () => {
  const rows = readInputs();
  if (!rows) { say('Every box needs a whole number from 0 to 30.', true); return; }
  const i = findIndex(path);
  if (i >= 0) DATA[i].rows = rows;
  else DATA.splice(Math.floor(Math.random() * (DATA.length + 1)), 0, { pattern: [...path], rows }); // random slot, so it doesn't stand out
  $('removeBtn').disabled = false; updateCount();
  say('Saved to data set. Download the JSON to keep it.');
});
$('removeBtn').addEventListener('click', () => {
  const i = findIndex(path); if (i < 0) return;
  DATA.splice(i, 1); path = []; drawPad(); renderRows(null); updateCount();
  $('saveBtn').disabled = true; $('removeBtn').disabled = true;
  say('Removed from data set.');
});
$('dlBtn').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([exportJSON()], { type: 'application/json' }));
  a.download = 'locker-data.json'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
$('copyBtn').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(exportJSON()); say('JSON copied.'); }
  catch { say('Copying is blocked here. Use Download JSON instead.', true); }
});
$('modeBtn').addEventListener('click', () => {
  editing = !editing; path = []; drawPad();
  $('modeBtn').setAttribute('aria-pressed', editing);
  $('modeBtn').textContent = editing ? 'Exit edit mode' : 'Edit mode';
  $('editTools').hidden = !editing;
  $('saveBtn').disabled = true; $('removeBtn').disabled = true;
  renderRows(null); updateCount();
  say(editing ? 'Swipe the pattern you want to set or change.' : 'Swipe a pattern to see its locker numbers.');
});
renderRows(null);
</script>
</body>
</html>
