<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>描红</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Zhi+Mang+Xing&family=Liu+Jian+Mao+Cao&family=Long+Cang&family=ZCOOL+XiaoWei&family=Noto+Serif+SC&family=Noto+Sans+SC&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.26.0/dist/index.js"></script>
<style>
:root{
  --panel:#f7f8f6; --panel-ink:#1d2321; --muted:#68716d; --line:#d9ddd9;
  --field:#ffffff; --accent:#b8332a; --paper:#ffffff;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --panel:#1b1f1e; --panel-ink:#e7ebe8; --muted:#9aa39f; --line:#343a38;
    --field:#121514; --accent:#e0675d;
    color-scheme: dark;
  }
}
*{box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent}
html,body{margin:0; background:var(--paper); overscroll-behavior:none}
body{font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif}
textarea,input{-webkit-user-select:text; user-select:text}

#sheet{position:relative; padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(48px + env(safe-area-inset-bottom,0px)); min-height:100vh; display:inline-block; min-width:100%}
#grid{position:relative}
.row{display:flex}
.cell{flex:none; display:flex; flex-direction:column}
.py{display:flex; align-items:flex-end; justify-content:center; white-space:nowrap; overflow:visible; font-family:-apple-system,"Helvetica Neue",sans-serif; letter-spacing:.02em}
.box{background-size:100% 100%; text-align:center; overflow:hidden}
.box + .box{margin-left:0}
#ink{position:absolute; left:0; top:0; touch-action:none; z-index:2}

#toggle{position:fixed; z-index:20; top:calc(10px + env(safe-area-inset-top,0px)); left:10px; width:40px; height:40px; border-radius:20px; border:1px solid var(--line); background:var(--panel); color:var(--panel-ink); font-size:18px; opacity:.45; cursor:pointer}
#toggle:hover,#toggle:focus-visible{opacity:1}
#panel{position:fixed; z-index:19; top:0; left:0; bottom:0; width:min(340px,92vw); background:var(--panel); color:var(--panel-ink); border-right:1px solid var(--line); padding:calc(60px + env(safe-area-inset-top,0px)) 18px calc(24px + env(safe-area-inset-bottom,0px)); overflow-y:auto; transform:translateX(-102%); transition:transform .22s ease; font-size:14px}
#panel.open{transform:none; box-shadow:0 0 40px rgba(0,0,0,.18)}
@media (prefers-reduced-motion: reduce){#panel{transition:none}}
#panel h2{font-size:12px; font-weight:600; color:var(--muted); margin:22px 0 8px; letter-spacing:.04em}
#panel h2:first-child{margin-top:0}
#panel textarea{width:100%; resize:vertical; background:var(--field); color:var(--panel-ink); border:1px solid var(--line); border-radius:8px; padding:10px; font:16px/1.5 "LXGW WenKai","PingFang SC",sans-serif}
#text{min-height:110px}
#py{min-height:70px; font-family:-apple-system,"Helvetica Neue",sans-serif!important; font-size:15px!important}
.ctl{display:grid; grid-template-columns:96px 1fr 38px; align-items:center; gap:8px; margin:9px 0}
.ctl span:last-child{text-align:right; color:var(--muted); font-variant-numeric:tabular-nums}
input[type=range]{width:100%; accent-color:var(--accent)}
select{width:100%; padding:8px; border-radius:8px; border:1px solid var(--line); background:var(--field); color:var(--panel-ink); font-size:15px}
.chk{display:flex; align-items:center; gap:8px; margin:10px 0}
.chk input{width:18px; height:18px; accent-color:var(--accent)}
.btns{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.btns button,.mini{padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:var(--field); color:var(--panel-ink); font-size:14px; cursor:pointer}
.btns button[aria-pressed=true]{border-color:var(--accent); color:var(--accent)}
.btns button:focus-visible,.mini:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
.hint{color:var(--muted); font-size:12px; line-height:1.45; margin:6px 0 0}
input[type=color]{width:44px; height:34px; border:1px solid var(--line); border-radius:8px; background:none; padding:2px}
.pyhead{display:flex; justify-content:space-between; align-items:center}

@media print{
  #toggle,#panel,#ink{display:none!important}
  #sheet{padding:0}
}
</style>
</head>
<body>
<button id="toggle" aria-label="Settings" aria-expanded="false">☰</button>

<aside id="panel" aria-label="Settings">
  <h2>文字 Text</h2>
  <textarea id="text" placeholder="粘贴中文…"></textarea>

  <div class="pyhead"><h2>拼音 Pinyin</h2><button class="mini" id="regen" title="Regenerate pinyin">↻ Auto</button></div>
  <textarea id="py" placeholder="nǐ hǎo (or ni3 hao3)"></textarea>
  <p class="hint">One syllable per character, separated by spaces. Edit any reading to fix it; tone numbers like ni3 are turned into marks.</p>
  <label class="chk"><input type="checkbox" id="showPy"> Show pinyin</label>

  <h2>字体 Font</h2>
  <select id="font">
    <option value="'LXGW WenKai'">霞鹜文楷 · WenKai (楷书)</option>
    <option value="'Kaiti SC','STKaiti','KaiTi','LXGW WenKai'">楷体 · System Kaiti</option>
    <option value="'Ma Shan Zheng'">马善政 · Brush 楷书</option>
    <option value="'Long Cang'">龙藏 · Handwriting 行书</option>
    <option value="'Zhi Mang Xing'">志莽行 · Running 行书</option>
    <option value="'Liu Jian Mao Cao'">刘建毛草 · Cursive 草书</option>
    <option value="'ZCOOL XiaoWei'">站酷小薇 · Elegant</option>
    <option value="'Noto Serif SC'">思源宋体 · Serif 宋体</option>
    <option value="'Noto Sans SC'">思源黑体 · Sans 黑体</option>
  </select>

  <h2>排版 Layout</h2>
  <div class="ctl"><label for="size">Size</label><input type="range" id="size" min="30" max="200" step="2"><span id="sizeV"></span></div>
  <div class="ctl"><label for="perLine">Per line</label><input type="range" id="perLine" min="0" max="30" step="1"><span id="perLineV"></span></div>
  <div class="ctl"><label for="lineH">Line height</label><input type="range" id="lineH" min="1" max="3" step="0.05"><span id="lineHV"></span></div>
  <div class="ctl"><label for="repeat">Repeat each</label><input type="range" id="repeat" min="1" max="12" step="1"><span id="repeatV"></span></div>
  <label class="chk"><input type="checkbox" id="fade"> Fade repeated copies</label>
  <div class="ctl"><label for="shade">Shade</label><input type="range" id="shade" min="0.05" max="0.7" step="0.01"><span id="shadeV"></span></div>
  <div class="ctl"><label for="gridSel">Grid</label>
    <select id="gridSel">
      <option value="tian">田字格</option>
      <option value="mi">米字格</option>
      <option value="kou">方格</option>
      <option value="none">None</option>
    </select><span></span></div>

  <h2>笔 Pen</h2>
  <div class="btns">
    <button id="toolPen" aria-pressed="true">✎ Pen</button>
    <button id="toolErase" aria-pressed="false">⌫ Eraser</button>
    <button id="undo">↶ Undo</button>
    <button id="clear">Clear ink</button>
  </div>
  <div class="ctl"><label for="penW">Width</label><input type="range" id="penW" min="1" max="20" step="0.5"><span id="penWV"></span></div>
  <div class="ctl"><label for="penC">Colour</label><input type="color" id="penC"><span></span></div>
  <label class="chk"><input type="checkbox" id="penOnly"> Pencil only (fingers scroll)</label>
  <p class="hint">With “Pencil only” on, your palm and fingers never leave marks; drag with a finger to scroll the sheet.</p>
</aside>

<main id="sheet">
  <div id="grid"></div>
  <canvas id="ink"></canvas>
</main>

<script>
(() => {
const $ = id => document.getElementById(id);
const HAN = /\p{Script=Han}/u;
const KEY = 'tracer-v1';
const DEF = {
  text:'学而时习之，不亦说乎？\n有朋自远方来，不亦乐乎？',
  py:'', showPy:true, font:"'LXGW WenKai'", size:90, perLine:0, lineH:1.15,
  repeat:1, fade:true, shade:0.22, grid:'tian', penW:4, penC:'#1a1a1a', penOnly:true
};
let S = Object.assign({}, DEF);
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s) Object.assign(S, s); } catch(e){}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };

// ---------- grid backgrounds ----------
const svg = inner => 'url("data:image/svg+xml,' + encodeURIComponent(
  `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' preserveAspectRatio='none'>${inner}</svg>`) + '")';
const border = `<rect x='0.6' y='0.6' width='98.8' height='98.8' fill='none' stroke='#d79a94' stroke-width='1.2'/>`;
const dash = d => `<path d='${d}' fill='none' stroke='#e6bcb7' stroke-width='0.8' stroke-dasharray='3 2.5'/>`;
const GRIDS = {
  tian: svg(border + dash('M50 0V100M0 50H100')),
  mi:   svg(border + dash('M50 0V100M0 50H100M0 0L100 100M100 0L0 100')),
  kou:  svg(border),
  none: 'none'
};

// ---------- pinyin ----------
function autoPinyin(text){
  if (!window.pinyinPro) return null;
  try {
    const all = pinyinPro.pinyin(text, { type:'all' });
    return all.filter(o => HAN.test(o.origin)).map(o => o.pinyin).join(' ');
  } catch(e){ return null; }
}
function toMarks(s){
  if (!s || !/[1-5]/.test(s) || !window.pinyinPro || !pinyinPro.convert) return s;
  try { return pinyinPro.convert(s, { format:'numToSymbol' }); } catch(e){ return s; }
}

// ---------- layout ----------
const grid = $('grid'), sheet = $('sheet'), canvas = $('ink'), ctx = canvas.getContext('2d');

function build(){
  const cell = S.size;
  const pad = 24;
  const avail = Math.max(cell, window.innerWidth - pad * 2);
  const perLine = S.perLine > 0 ? S.perLine : Math.max(1, Math.floor(avail / cell));
  const pyH = S.showPy ? Math.round(cell * 0.34) : 0;
  const gap = Math.round(cell * (S.lineH - 1));
  const pyList = S.py.trim() ? S.py.trim().split(/\s+/) : [];
  let hi = 0;

  const frag = document.createDocumentFragment();
  const paras = S.text.replace(/\r/g, '').split('\n');

  for (const para of paras){
    const toks = [];
    for (const ch of para){
      if (/\s/.test(ch)) continue;
      if (HAN.test(ch)){
        const p = toMarks(pyList[hi++] || '');
        for (let k = 0; k < S.repeat; k++){
          const a = S.fade && S.repeat > 1 ? S.shade * (1 - 0.75 * k / (S.repeat - 1)) : S.shade;
          toks.push({ ch, py:p, a });
        }
      } else toks.push({ ch, py:'', a:S.shade });
    }
    if (!toks.length) continue;
    for (let i = 0; i < toks.length; i += perLine){
      const row = document.createElement('div');
      row.className = 'row';
      row.style.marginBottom = gap + 'px';
      for (let j = 0; j < perLine; j++){
        const t = toks[i + j];
        const c = document.createElement('div');
        c.className = 'cell';
        c.style.width = cell + 'px';
        if (pyH){
          const p = document.createElement('div');
          p.className = 'py';
          p.style.height = pyH + 'px';
          p.style.fontSize = Math.max(9, Math.round(cell * 0.2)) + 'px';
          p.style.color = `rgba(0,0,0,${Math.min(1, (t ? t.a : S.shade) + 0.18)})`;
          p.textContent = t ? t.py : '';
          c.appendChild(p);
        }
        const b = document.createElement('div');
        b.className = 'box';
        b.style.cssText = `width:${cell}px;height:${cell}px;line-height:${cell}px;font-size:${Math.round(cell*0.82)}px;font-family:${S.font},'LXGW WenKai','PingFang SC',serif;background-image:${GRIDS[S.grid]};color:rgba(0,0,0,${t ? t.a : 0})`;
        b.textContent = t ? t.ch : '';
        c.appendChild(b);
        row.appendChild(c);
      }
      frag.appendChild(row);
    }
  }
  grid.replaceChildren(frag);
  sizeCanvas();
}

// ---------- ink ----------
let strokes = [], cur = null, tool = 'pen', dpr = 1;
let scrollPt = null;

function sizeCanvas(){
  const w = Math.max(sheet.scrollWidth, window.innerWidth);
  const h = Math.max(sheet.scrollHeight, window.innerHeight);
  // stay under iOS canvas pixel limit (~16.7M)
  dpr = Math.min(window.devicePixelRatio || 1, Math.sqrt(16e6 / (w * h)));
  canvas.width = Math.floor(w * dpr);
  canvas.height = Math.floor(h * dpr);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  redraw();
}
function widthFor(s, p){
  const base = s.tool === 'erase' ? s.w * 4 : s.w;
  return s.pressure ? base * (0.35 + p * 1.1) : base;
}
function seg(s, a, b){
  ctx.globalCompositeOperation = s.tool === 'erase' ? 'destination-out' : 'source-over';
  ctx.strokeStyle = s.c;
  ctx.lineWidth = widthFor(s, b[2]);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(a[0], a[1]);
  ctx.lineTo(b[0], b[1]);
  ctx.stroke();
}
function dot(s, a){
  ctx.globalCompositeOperation = s.tool === 'erase' ? 'destination-out' : 'source-over';
  ctx.fillStyle = s.c;
  ctx.beginPath();
  ctx.arc(a[0], a[1], widthFor(s, a[2]) / 2, 0, Math.PI * 2);
  ctx.fill();
}
function drawStroke(s){
  if (s.pts.length === 1) return dot(s, s.pts[0]);
  for (let i = 1; i < s.pts.length; i++) seg(s, s.pts[i-1], s.pts[i]);
}
function redraw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  strokes.forEach(drawStroke);
}
function pt(e){
  const r = canvas.getBoundingClientRect();
  return [e.clientX - r.left, e.clientY - r.top, e.pressure || 0.5];
}

canvas.addEventListener('pointerdown', e => {
  if (S.penOnly && e.pointerType === 'touch'){
    scrollPt = { id:e.pointerId, x:e.clientX, y:e.clientY };
    canvas.setPointerCapture(e.pointerId);
    return;
  }
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);
  cur = { id:e.pointerId, tool, w:S.penW, c:S.penC, pressure:e.pointerType === 'pen', pts:[pt(e)] };
  ctx.setTransform(dpr,0,0,dpr,0,0);
  dot(cur, cur.pts[0]);
});
canvas.addEventListener('pointermove', e => {
  if (scrollPt && e.pointerId === scrollPt.id){
    window.scrollBy(scrollPt.x - e.clientX, scrollPt.y - e.clientY);
    scrollPt.x = e.clientX; scrollPt.y = e.clientY;
    return;
  }
  if (!cur || e.pointerId !== cur.id) return;
  e.preventDefault();
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of (evs.length ? evs : [e])){
    const p = pt(ev);
    const last = cur.pts[cur.pts.length - 1];
    if (Math.abs(p[0]-last[0]) + Math.abs(p[1]-last[1]) < 0.6) continue;
    cur.pts.push(p);
    seg(cur, last, p);
  }
});
const end = e => {
  if (scrollPt && e.pointerId === scrollPt.id){ scrollPt = null; return; }
  if (cur && e.pointerId === cur.id){ strokes.push(cur); cur = null; }
};
canvas.addEventListener('pointerup', end);
canvas.addEventListener('pointercancel', end);
// block iOS selection / magnifier / double-tap zoom on the sheet
sheet.addEventListener('touchstart', e => { if (e.target === canvas) e.preventDefault(); }, { passive:false });
document.addEventListener('gesturestart', e => e.preventDefault());

// ---------- controls ----------
const panel = $('panel'), toggle = $('toggle');
function setPanel(open){
  panel.classList.toggle('open', open);
  toggle.setAttribute('aria-expanded', open);
  toggle.textContent = open ? '✕' : '☰';
}
toggle.onclick = () => setPanel(!panel.classList.contains('open'));

const fmt = {
  size: v => v, perLine: v => v == 0 ? 'auto' : v, lineH: v => (+v).toFixed(2),
  repeat: v => '×' + v, shade: v => Math.round(v * 100) + '%', penW: v => v
};
let t;
const rebuildSoon = () => { clearTimeout(t); t = setTimeout(build, 60); };

for (const k of Object.keys(fmt)){
  const el = $(k), out = $(k + 'V');
  el.value = S[k]; out.textContent = fmt[k](S[k]);
  el.addEventListener('input', () => {
    S[k] = +el.value; out.textContent = fmt[k](el.value); save();
    if (k !== 'penW') rebuildSoon();
  });
}
const bindChk = (id, key, rebuild = true) => {
  const el = $(id); el.checked = S[key];
  el.onchange = () => { S[key] = el.checked; save(); if (rebuild) build(); };
};
bindChk('showPy', 'showPy'); bindChk('fade', 'fade'); bindChk('penOnly', 'penOnly', false);

$('font').value = S.font;
$('font').onchange = e => { S.font = e.target.value; save(); build(); };
$('gridSel').value = S.grid;
$('gridSel').onchange = e => { S.grid = e.target.value; save(); build(); };
$('penC').value = S.penC;
$('penC').oninput = e => { S.penC = e.target.value; save(); };

const textEl = $('text'), pyEl = $('py');
textEl.value = S.text; pyEl.value = S.py;
let tt;
textEl.addEventListener('input', () => {
  S.text = textEl.value;
  clearTimeout(tt);
  tt = setTimeout(() => {
    const p = autoPinyin(S.text);
    if (p !== null){ S.py = p; pyEl.value = p; }
    save(); build();
  }, 300);
});
pyEl.addEventListener('input', () => { S.py = pyEl.value; save(); rebuildSoon(); });
$('regen').onclick = () => {
  const p = autoPinyin(S.text);
  if (p !== null){ S.py = p; pyEl.value = p; save(); build(); }
};

const setTool = tl => {
  tool = tl;
  $('toolPen').setAttribute('aria-pressed', tl === 'pen');
  $('toolErase').setAttribute('aria-pressed', tl === 'erase');
};
$('toolPen').onclick = () => setTool('pen');
$('toolErase').onclick = () => setTool('erase');
$('undo').onclick = () => { strokes.pop(); redraw(); };
$('clear').onclick = () => { strokes = []; redraw(); };

let rt;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(build, 150); });

// ---------- start ----------
if (!S.py.trim()){
  const p = autoPinyin(S.text);
  if (p !== null){ S.py = p; pyEl.value = p; save(); }
}
build();
if (document.fonts) document.fonts.ready.then(sizeCanvas);
})();
</script>
</body>
</html>
