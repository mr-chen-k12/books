<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>10x10 Swipe Pattern Data Vault</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #1e293b;
        --panel-border: #334155;
        --text: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-glow: rgba(56, 189, 248, 0.35);
        --success: #22c55e;
        --danger: #ef4444;
        --node-bg: #0f172a;
        --node-border: #475569;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 24px 16px;
      }

      .container {
        width: 100%;
        max-width: 520px;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        gap: 12px;
      }

      .header h1 {
        font-size: 1.2rem;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      .btn {
        background: #334155;
        color: var(--text);
        border: 1px solid #475569;
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .btn:hover {
        background: #475569;
      }

      .btn-primary {
        background: var(--accent);
        color: #0f172a;
        border-color: var(--accent);
        font-weight: 600;
      }

      .btn-primary:hover {
        background: #7dd3fc;
      }

      .btn-success {
        background: var(--success);
        color: #052e16;
        border-color: var(--success);
        font-weight: 600;
      }

      .btn-success:hover {
        background: #4ade80;
      }

      .btn-sm {
        padding: 5px 10px;
        font-size: 0.78rem;
      }

      /* Data Display & Setup Rows */
      .section-card {
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid var(--panel-border);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 20px;
      }

      .section-title {
        font-size: 0.82rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin-bottom: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .rows-container {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .data-row {
        display: grid;
        grid-template-columns: 64px repeat(3, 1fr);
        align-items: center;
        gap: 8px;
      }

      .row-label {
        font-size: 0.85rem;
        color: var(--muted);
        font-weight: 500;
      }

      .value-box {
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 8px;
        padding: 10px;
        text-align: center;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 1.05rem;
        font-weight: 600;
        color: var(--accent);
      }

      .value-box.placeholder {
        color: #475569;
      }

      input[type="number"] {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--node-border);
        border-radius: 8px;
        padding: 9px 6px;
        color: var(--text);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 1rem;
        text-align: center;
        outline: none;
      }

      input[type="number"]:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px var(--accent-glow);
      }

      /* 10x10 Swipe Grid */
      .grid-wrapper {
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 1;
        background: var(--bg);
        border: 1px solid var(--panel-border);
        border-radius: 12px;
        touch-action: none;
        user-select: none;
        overflow: hidden;
      }

      .swipe-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
      }

      .grid-nodes {
        position: relative;
        z-index: 2;
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        grid-template-rows: repeat(10, 1fr);
        width: 100%;
        height: 100%;
        padding: 8px;
      }

      .node-cell {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .node-dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--node-bg);
        border: 2px solid var(--node-border);
        transition:
          transform 0.12s ease,
          background 0.12s ease,
          border-color 0.12s ease;
      }

      .node-dot.active {
        background: var(--accent);
        border-color: #e0f2fe;
        transform: scale(1.35);
        box-shadow: 0 0 10px var(--accent-glow);
      }

      .node-dot.start {
        background: var(--success);
        border-color: #dcfce7;
      }

      .status-bar {
        margin-top: 12px;
        font-size: 0.85rem;
        color: var(--muted);
        display: flex;
        justify-content: space-between;
        align-items: center;
        min-height: 24px;
      }

      .status-msg.error {
        color: var(--danger);
      }

      .status-msg.ok {
        color: var(--success);
      }

      .setup-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 16px;
      }

      .setup-actions .btn {
        flex: 1;
        text-align: center;
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>

      <div class="header">
        <h1 id="modeTitle">Swipe Pattern Input</h1>
        <button id="toggleModeBtn" class="btn">Setup Mode</button>
      </div>

      <!-- UNLOCK / DISPLAY VIEW -->
      <div id="unlockSection" class="section-card">
        <div class="section-title">
          <span>Output Data (0 – 30)</span>
          <span id="outputStateLabel">Awaiting Swipe</span>
        </div>
        <div id="outputRows" class="rows-container"></div>
      </div>

      <!-- SETUP VIEW -->

        <div class="section-title">
          <span>Step 1: Enter Row Values (0 – 30)</span>
          <div>
            <button id="toggleRowCountBtn" class="btn btn-sm" type="button">Use 3 Rows</button>
          </div>
        </div>
        <div id="setupRows" class="rows-container"></div>
      </div>

      <!-- SHARED 10x10 SWIPE PAD -->
      <div class="section-card" style="margin-bottom: 0">
        <div class="section-title">
          <span id="gridInstruction">Draw 10×10 Pattern to Retrieve Data</span>
          <button id="clearPatternBtn" class="btn btn-sm hidden" type="button">Clear Swipe</button>
        </div>

        <div id="gridWrapper" class="grid-wrapper">

          <button id="downloadJsonBtn" class="btn btn-success" type="button">Download JSON</button>
        </div>
      </div>
    </div>

      // =========================================================================
      // INITIALIZE 10x10 GRID
      // =========================================================================
      const nodeElements = [];

      function buildGrid() {
        gridNodesEl.innerHTML = "";
        nodeElements.length = 0;

        for (let i = 0; i < 100; i++) {
          const cell = document.createElement("div");
          cell.className = "node-cell";

          const dot = document.createElement("div");
          dot.className = "node-dot";
          dot.dataset.index = i;

          cell.appendChild(dot);
          gridNodesEl.appendChild(cell);
          nodeElements.push(dot);
        }
      }

      // =========================================================================
      // RENDER OUTPUT & SETUP INPUTS
      // =========================================================================
      function getDefaultRowCount() {
        return activeDecoys[0]?.rows?.length || 5;
      }

      function renderPlaceholderOutput(rowCount = getDefaultRowCount()) {
        outputRowsEl.innerHTML = "";
        for (let r = 0; r < rowCount; r++) {
          const rowDiv = document.createElement("div");
          rowDiv.className = "data-row";
          rowDiv.innerHTML = `
          <span class="row-label">Row ${r + 1}</span>
          <div class="value-box placeholder">--</div>
          <div class="value-box placeholder">--</div>
          <div class="value-box placeholder">--</div>
        `;
          outputRowsEl.appendChild(rowDiv);
        }
      }

      function renderResultRows(rows) {
        outputRowsEl.innerHTML = "";
        rows.forEach((triple, idx) => {
          const rowDiv = document.createElement("div");
          rowDiv.className = "data-row";
          rowDiv.innerHTML = `
          <span class="row-label">Row ${idx + 1}</span>
          <div class="value-box">${String(triple[0]).padStart(2, "0")}</div>
          <div class="value-box">${String(triple[1]).padStart(2, "0")}</div>
          <div class="value-box">${String(triple[2]).padStart(2, "0")}</div>
        `;
          outputRowsEl.appendChild(rowDiv);
        });
        outputStateLabel.textContent = "Data Loaded";
      }

      function renderSetupInputs() {
        const existingValues = readSetupInputsRaw();
        setupRowsEl.innerHTML = "";

        for (let r = 0; r < setupRowCount; r++) {
          const rowDiv = document.createElement("div");
          rowDiv.className = "data-row";

          const label = document.createElement("span");
          label.className = "row-label";
          label.textContent = `Row ${r + 1}`;
          rowDiv.appendChild(label);

          for (let c = 0; c < 3; c++) {
            const input = document.createElement("input");
            input.type = "number";
            input.min = "0";
            input.max = "30";
            input.step = "1";
            input.placeholder = "0-30";
            input.dataset.row = r;
            input.dataset.col = c;

            if (existingValues[r] && existingValues[r][c] !== "") {
              input.value = existingValues[r][c];
            }

            rowDiv.appendChild(input);
          }
          setupRowsEl.appendChild(rowDiv);
        }
      }

      function readSetupInputsRaw() {
        const matrix = [];
        const inputs = setupRowsEl.querySelectorAll("input[type='number']");
        inputs.forEach((inp) => {
          const r = Number(inp.dataset.row);
          const c = Number(inp.dataset.col);
          if (!matrix[r]) matrix[r] = [];
          matrix[r][c] = inp.value.trim();
        });
        return matrix;
      }

      function validateSetupData() {
        const raw = readSetupInputsRaw();
        const parsedRows = [];

        for (let r = 0; r < setupRowCount; r++) {
          const row = [];
          for (let c = 0; c < 3; c++) {
            const valStr = raw[r]?.[c] ?? "";
            if (valStr === "") {
              return { ok: false, error: `Row ${r + 1}, Value ${c + 1} is empty.` };
            }
            const num = Number(valStr);
            if (!Number.isInteger(num) || num < 0 || num > 30) {
              return {
                ok: false,
                error: `Row ${r + 1}, Value ${c + 1} must be an integer between 0 and 30.`,
              };
            }
            row.push(num);
          }
          parsedRows.push(row);
        }

        if (setupPattern.length < 2) {
          return { ok: false, error: "Draw a swipe pattern connecting at least 2 dots at the bottom." };
        }

        return {
          ok: true,
          entry: {
            pattern: [...setupPattern],
            rows: parsedRows,
          },
        };
      }

      // =========================================================================
      // SWIPE GEOMETRY & DRAWING
      // =========================================================================
      function getNodeCenter(index) {
        const wrapperRect = gridWrapper.getBoundingClientRect();
        const dotRect = nodeElements[index].getBoundingClientRect();
        return {
          x: dotRect.left - wrapperRect.left + dotRect.width / 2,
          y: dotRect.top - wrapperRect.top + dotRect.height / 2,
        };
      }

      function getHitRadius() {
        const wrapperRect = gridWrapper.getBoundingClientRect();
        const cellSize = wrapperRect.width / 10;
        return cellSize * 0.34;
      }

      function getRelativePointer(clientX, clientY) {
        const rect = gridWrapper.getBoundingClientRect();
        return {
          x: clientX - rect.left,
          y: clientY - rect.top,
        };
      }

      function checkNodeHit(pt) {
        const radius = getHitRadius();
        for (let i = 0; i < 100; i++) {
          if (currentPattern.includes(i)) continue;
          const center = getNodeCenter(i);
          const dist = Math.hypot(pt.x - center.x, pt.y - center.y);
          if (dist <= radius) {
            currentPattern.push(i);
            updateGridVisuals(currentPattern, isDrawing ? pt : null);
            break;
          }
        }
      }

      function updateGridVisuals(pattern, trailingPt = null) {
        nodeElements.forEach((dot, idx) => {
          dot.classList.remove("active", "start");
          if (pattern.includes(idx)) {
            dot.classList.add("active");
            if (pattern[0] === idx) {
              dot.classList.add("start");
            }
          }
        });

        swipeSvg.innerHTML = "";
        if (pattern.length === 0) {
          nodeCountBadge.textContent = "";
          return;
        }

        nodeCountBadge.textContent = `${pattern.length} dots`;

        const points = pattern.map((idx) => {
          const c = getNodeCenter(idx);
          return `${c.x},${c.y}`;
        });

        if (trailingPt) {
          points.push(`${trailingPt.x},${trailingPt.y}`);
        }

        const polyline = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
        polyline.setAttribute("points", points.join(" "));
        polyline.setAttribute("fill", "none");
        polyline.setAttribute("stroke", "#38bdf8");
        polyline.setAttribute("stroke-width", "3");
        polyline.setAttribute("stroke-linecap", "round");
        polyline.setAttribute("stroke-linejoin", "round");
        polyline.setAttribute("opacity", "0.85");
        swipeSvg.appendChild(polyline);
      }

      function patternsMatch(a, b) {
        if (!Array.isArray(a) || !Array.isArray(b) || a.length !== b.length) return false;
        for (let i = 0; i < a.length; i++) {
          if (a[i] !== b[i]) return false;
        }
        return true;
      }

      // Generates deterministic, plausible 0-30 rows when a swipe is not in DECOY
      // so random swipes look identical in structure without exposing stored entries.
      function generateFallbackRows(pattern, targetRowCount) {
        let seed = 2166136261;
        for (let i = 0; i < pattern.length; i++) {
          seed ^= pattern[i] + 17;
          seed = Math.imul(seed, 16777619);
        }

        const rows = [];
        for (let r = 0; r < targetRowCount; r++) {
          const triple = [];
          for (let c = 0; c < 3; c++) {
            seed ^= seed << 13;
            seed ^= seed >>> 17;
            seed ^= seed << 5;
            triple.push(Math.abs(seed) % 31);
          }
          rows.push(triple);
        }
        return rows;
      }

      function handleSwipeComplete() {
        if (currentPattern.length < 2) {
          currentPattern = [];
          updateGridVisuals([]);
          return;
        }

        if (isSetupMode) {
          setupPattern = [...currentPattern];
          updateGridVisuals(setupPattern, null);
          setStatus(`Pattern recorded (${setupPattern.length} dots). Ready to save or download JSON.`, "ok");
        } else {
          const matchedEntry = activeDecoys.find((entry) => patternsMatch(currentPattern, entry.pattern));

          if (matchedEntry) {
            renderResultRows(matchedEntry.rows);
          } else {
            renderResultRows(generateFallbackRows(currentPattern, getDefaultRowCount()));
          }
          setStatus("Swipe processed.", "");

          const snapshot = [...currentPattern];
          updateGridVisuals(snapshot, null);
          setTimeout(() => {
            if (!isDrawing && !isSetupMode) {
              updateGridVisuals([]);
            }
          }, 450);
        }

        currentPattern = [];
      }

      function setStatus(text, type = "") {
        statusMsg.textContent = text;
        statusMsg.className = "status-msg" + (type ? ` ${type}` : "");
      }

      // =========================================================================
      // POINTER EVENTS (MOUSE & TOUCH)
      // =========================================================================
      function onPointerStart(clientX, clientY) {
        isDrawing = true;
        currentPattern = [];
        const pt = getRelativePointer(clientX, clientY);
        pointerPos = pt;
        checkNodeHit(pt);
      }

      function onPointerMove(clientX, clientY) {
        if (!isDrawing) return;
        const pt = getRelativePointer(clientX, clientY);
        pointerPos = pt;
        checkNodeHit(pt);
        if (currentPattern.length > 0) {
          updateGridVisuals(currentPattern, pt);
        }
      }

      function onPointerEnd() {
        if (!isDrawing) return;
        isDrawing = false;
        pointerPos = null;
        handleSwipeComplete();
      }

      gridWrapper.addEventListener("mousedown", (e) => {
        e.preventDefault();
        onPointerStart(e.clientX, e.clientY);
      });

      window.addEventListener("mousemove", (e) => {
        onPointerMove(e.clientX, e.clientY);
      });

      window.addEventListener("mouseup", () => {
        onPointerEnd();
      });

      gridWrapper.addEventListener(
        "touchstart",
        (e) => {
          e.preventDefault();
          const touch = e.touches[0];
          onPointerStart(touch.clientX, touch.clientY);
        },
        { passive: false },
      );

      gridWrapper.addEventListener(
        "touchmove",
        (e) => {
          e.preventDefault();
          const touch = e.touches[0];
          onPointerMove(touch.clientX, touch.clientY);
        },
        { passive: false },
      );

      window.addEventListener("touchend", () => {
        onPointerEnd();
      });

      window.addEventListener("resize", () => {
        if (isSetupMode && setupPattern.length > 0) {
          updateGridVisuals(setupPattern);
        }
      });

      // =========================================================================
      // MODE SWITCHING & BUTTON HANDLERS
      // =========================================================================
      toggleModeBtn.addEventListener("click", () => {
        isSetupMode = !isSetupMode;
        currentPattern = [];

        if (isSetupMode) {
          modeTitle.textContent = "Setup Mode";
          toggleModeBtn.textContent = "Back to Swipe View";
          unlockSection.classList.add("hidden");
          setupSection.classList.remove("hidden");
          setupActions.classList.remove("hidden");
          clearPatternBtn.classList.remove("hidden");
          gridInstruction.textContent = "Step 2: Draw Swipe Pattern at Bottom";
          setupRowCount = getDefaultRowCount() === 3 ? 3 : 5;
          toggleRowCountBtn.textContent = setupRowCount === 3 ? "Use 5 Rows" : "Use 3 Rows";
          renderSetupInputs();
          setupPattern = [];
          updateGridVisuals([]);
          setStatus("Enter numbers (0-30) above, then draw your pattern.", "");
        } else {
          modeTitle.textContent = "Swipe Pattern Input";
          toggleModeBtn.textContent = "Setup Mode";
          setupSection.classList.add("hidden");
          setupActions.classList.add("hidden");
          clearPatternBtn.classList.add("hidden");
          unlockSection.classList.remove("hidden");
          gridInstruction.textContent = "Draw 10×10 Pattern to Retrieve Data";
          outputStateLabel.textContent = "Awaiting Swipe";
          renderPlaceholderOutput();
          updateGridVisuals([]);
          setStatus("Drag across dots on the 10×10 grid.", "");
        }
      });

      toggleRowCountBtn.addEventListener("click", () => {
        setupRowCount = setupRowCount === 3 ? 5 : 3;
        toggleRowCountBtn.textContent = setupRowCount === 3 ? "Use 5 Rows" : "Use 3 Rows";
        renderSetupInputs();
      });

      clearPatternBtn.addEventListener("click", () => {
        setupPattern = [];
        currentPattern = [];
        updateGridVisuals([]);
        setStatus("Pattern cleared. Draw a new swipe pattern.", "");
      });

      applySessionBtn.addEventListener("click", () => {
        const result = validateSetupData();
        if (!result.ok) {
          setStatus(result.error, "error");
          return;
        }

        // Add or update this entry inside the active DECOY pool for immediate testing
        const existingIdx = activeDecoys.findIndex((item) =>
          patternsMatch(item.pattern, result.entry.pattern),
        );
        if (existingIdx !== -1) {
          activeDecoys[existingIdx] = result.entry;
        } else {
          activeDecoys.push(result.entry);
        }

        setStatus("Added to active DECOY pool! Switching to Swipe View...", "ok");
        setTimeout(() => {
          toggleModeBtn.click();
        }, 500);
      });

      downloadJsonBtn.addEventListener("click", () => {
        const result = validateSetupData();
        if (!result.ok) {
          setStatus(result.error, "error");
          return;
        }

        const jsonString = JSON.stringify(result.entry, null, 2);
        const blob = new Blob([jsonString], { type: "application/json" });
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = "decoy-entry.json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        setStatus("Downloaded decoy-entry.json! Paste it into const DECOY = [ ... ].", "ok");
      });

      // Boot
      buildGrid();
      renderPlaceholderOutput();
    </script>
  </body>
</html>
